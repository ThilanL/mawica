# Deploy Mawica to the temporary Azure STAGING environment (Container Apps, Australia East; PostgreSQL in Southeast Asia, private).
# Manual only (Actions tab -> deploy-staging -> Run workflow), after CI is green. The "staging" GitHub environment must require the
# owner's approval and allow only the main branch.
# Azure sign-in: OpenID Connect via the managed identity id-mawica-stg-github (federated credential for environment "staging"); no secret.
#   It may only: update the web container app and the migration job, start the migration job, and join their environment.
# Repository VARIABLES (not secrets): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, STAGING_URL.
# Images: GitHub Container Registry (free). Make the two packages public once after the first push (the repository is public), so the
# container app can pull without registry credentials.
# First-time setup (database roles, jobs, the container app itself) is done once by the owner with infra/staging/app.sh, not here.
name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run prisma migrate deploy (migration job inside the VNet) before updating the app"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RG: rg-mawica-staging-aue
  APP: ca-mawica-stg
  MIGRATE_JOB: caj-mawica-stg-migrate
  MAWICA_SUBSCRIPTION_ID: d5b6244c-44ac-49fb-9e93-a628acfea802

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Require the staging URL variable
        run: test -n "${{ vars.STAGING_URL }}" || { echo "Set the STAGING_URL repository variable"; exit 1; }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push web and migrate images (Linux x64, Node 24)
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.STAGING_URL }}" -t "$repo/web:${{ steps.meta.outputs.tag }}" .
          docker build --target migrate -t "$repo/migrate:${{ steps.meta.outputs.tag }}" .
          docker push "$repo/web:${{ steps.meta.outputs.tag }}"
          docker push "$repo/migrate:${{ steps.meta.outputs.tag }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging            # required reviewer: the owner
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Identity guard (Mawica subscription only)
        run: |
          [ "$(az account show --query id -o tsv)" = "$MAWICA_SUBSCRIPTION_ID" ] || { echo "Not the Mawica subscription"; exit 1; }
      - name: Migrations (job inside the VNet; the database has no public endpoint)
        if: inputs.run_migrations
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          az containerapp job update -g "$RG" -n "$MIGRATE_JOB" --image "$repo/migrate:${{ needs.build.outputs.tag }}" -o none
          run="$(az containerapp job start -g "$RG" -n "$MIGRATE_JOB" --query name -o tsv)"
          for i in $(seq 1 60); do
            state="$(az containerapp job execution show -g "$RG" -n "$MIGRATE_JOB" --job-execution-name "$run" --query properties.status -o tsv)"
            [ "$state" = "Succeeded" ] && break
            [ "$state" = "Failed" ] && { echo "Migration failed; the app was NOT updated"; exit 1; }
            sleep 10
          done
          [ "$state" = "Succeeded" ] || { echo "Migration timed out; the app was NOT updated"; exit 1; }
      - name: Update the web app image (new revision; the previous one stays available for rollback)
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          az containerapp update -g "$RG" -n "$APP" --image "$repo/web:${{ needs.build.outputs.tag }}" -o none
      - name: Smoke tests (first request may include a cold start)
        run: |
          url="${{ vars.STAGING_URL }}"
          for i in $(seq 1 30); do code="$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health" || true)"; [ "$code" = "200" ] && break; sleep 10; done
          [ "$code" = "200" ] || { echo "health check failed ($code)"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/")" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/c/doesnotexist1")" = "404" ]
          curl -sI "$url/" | grep -qi "strict-transport-security"
          curl -sI "$url/ar/special-gift.usdz" | grep -qi "content-type: model/vnd.usdz+zip"
