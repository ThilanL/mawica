# Test-only CI for pull requests and main. No deployment, no cloud credentials, no secrets, no real email.
# Everything below runs against a throwaway PostgreSQL service container that exists only for this job.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mawica_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mawica_test
        ports:
          - 5433:5432   # the repository's database isolation guard requires the Mawica port
        options: >-
          --health-cmd "pg_isready -U mawica_app -d mawica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only dummy values. The database is the service container above (127.0.0.1), never a hosted one.
      DATABASE_URL: postgresql://mawica_app:ci_only_password@127.0.0.1:5433/mawica_test?schema=public
      TEST_DATABASE_URL: postgresql://mawica_app:ci_only_password@127.0.0.1:5433/mawica_test?schema=public
      BETTER_AUTH_SECRET: ci-only-dummy-secret-ci-only-dummy-secret-0000
      WELCOME_PEPPER: ci-only-dummy-pepper-ci-only-dummy-pepper-00
      RATE_LIMIT_SALT: ci-only-dummy-salt-ci-only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      TRUSTED_PROXY_HOPS: "1"
      # Used only by the schema-drift test (prisma migrate diff); a second throwaway database on the same service container.
      SHADOW_DATABASE_URL: postgresql://mawica_app:ci_only_password@127.0.0.1:5433/mawica_shadow?schema=public
      # No email provider credentials exist anywhere in this workflow (no ACS endpoint or key), so nothing can be sent;
      # the tests use the mocked provider or the local file outbox. Recipient email delivery stays off.
      # (MAWICA_ENV only accepts "local" in src/lib/env.ts, and tests set their own EMAIL_PROVIDER, so neither is set here.)
      EMAIL_DELIVERY_ENABLED: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the shadow database (CI service container only)
        run: PGPASSWORD=ci_only_password psql -h 127.0.0.1 -p 5433 -U mawica_app -d mawica_test -c 'CREATE DATABASE mawica_shadow'
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        # Route/layout types (LayoutProps, PageProps) are generated by Next; generate them first so tsc works on a fresh checkout.
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
